name: Apply topic destinations

on:
  push:
    branches: [feat/topic-destinations]
    paths:
      - '.github/scripts/apply_topic_destinations.py'
      - '.github/scripts/fix_topic_request.py'
      - '.github/workflows/apply-topic-destinations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/topic-destinations
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          python .github/scripts/apply_topic_destinations.py
          python .github/scripts/fix_topic_request.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate
        run: |
          python -m py_compile upload.py
          python -m unittest discover -s tests -v
      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upload.py README.md tests
          if (-not (git diff --cached --quiet)) {
            git commit -m "feat: adiciona destinos com tópicos do Telegram"
            git push origin HEAD:feat/topic-destinations
          }
