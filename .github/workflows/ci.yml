name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile upload.py launcher.py entrypoint.py runtime.py fast_upload.py telegram_video.py library_layout.py catalog_enrichment.py catalog_fixes.py media_compat.py anime_catalog.py media_catalog.py channel_clone.py
      - name: Tests
        run: python -m unittest discover -s tests -v
